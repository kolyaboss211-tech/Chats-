<style>

/* ================= RESET ================= */

* {
  box-sizing: border-box;

}

html,
body {
  width: 100%;

}

body {

  font-family: Arial, sans-serif;

}

  width: 100%;

  display: flex;

}


/* ================= HEADER ================= */

  align-items: center;

  color: white;

  cursor: pointer;
}

.header-title {
  font-size: 18px;
  font-weight: bold;
}

.header-status {
  font-size: 12px;
  color: #8b9ba5;

}


/* ================= CONTACTS ================= */

#contactsScreen {
  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}

.search {
  padding: 8px;

  background: #17212b;

}

.search input {
  width: 100%;

}

}

#contacts {
  flex: 1;

  min-height: 0;

  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.contact {
  display: flex;
  align-items: center;

  padding: 9px 12px;

  cursor: pointer;

  border-bottom:
  1px solid rgba(255,255,255,.04);
}

.contact:active {
  background: #263544;
}

.avatar {
  width: 44px;
  height: 44px;

  border-radius: 50%;

  background: #2ea6ff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 19px;
  font-weight: bold;

  margin-right: 11px;

  flex-shrink: 0;
}

.contact-info {

}

.contact-name {
  font-size: 16px;

}

.contact-status {
  margin-top: 3px;

  color: #8495a0;
}

.online {
  color: #35d07f;
}

.empty {
  text-align: center;

  color: #82909a;

}


/* ================= CHAT ================= */

#chatScreen {

  width: 100%;
  height: 100%;

  display: none;

  flex-direction: column;

  overflow: hidden;
}


/* ================= CHAT HEADER ================= */

.chat-header-avatar {

  width: 38px !important;
  height: 38px !important;

  margin: 0 !important;

  font-size: 17px !important;
}


/* ================= MESSAGES ================= */

#chat {

  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding: 8px 7px 10px;

  -webkit-overflow-scrolling: touch;
}

.message-row {

  display: flex;

  margin: 5px 2px;
}

.message-row.my {
  justify-content: flex-end;
}

.message-row.other {
  justify-content: flex-start;
}

.message {

  max-width: 78%;

  padding: 7px 10px;

  border-radius: 15px;

  word-break: break-word;

  box-shadow:
  0 2px 5px rgba(0,0,0,.22);
}

.message.my {

  background: #2ea6ff;

  border-bottom-right-radius: 4px;
}

.message.other {

  background: #2b3945;

  border-bottom-left-radius: 4px;
}

.message-name {

  color: #7ed0ff;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 3px;
}

.message-text {

  font-size: 16px;

  line-height: 1.3;

  white-space: pre-wrap;
}

.message-bottom {

  display: flex;

  justify-content: flex-end;

  align-items: center;

  gap: 4px;

  margin-top: 3px;

  font-size: 10px;

  color:
  rgba(255,255,255,.75);
}


/* ================= IMAGE ================= */

.chat-image {

  display: block;

  max-width: 230px;

  max-height: 300px;

  border-radius: 10px;

  margin-top: 2px;

  cursor: pointer;
}


/* ================= FILE ================= */

.file-message {

  display: flex;

  align-items: center;

  gap: 9px;

  padding: 5px 0;

  text-decoration: none;

  color: white;
}

.file-icon {

  width: 38px;
  height: 38px;

  border-radius: 9px;

  background: rgba(255,255,255,.18);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 20px;
}

.file-name {

  font-size: 14px;

  max-width: 180px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}


/* ================= INPUT ================= */

.input-area {

  width: 100%;

  min-height: 58px;

  padding:
  6px 7px;

  background: #202b36;

  display: flex;

  align-items: center;

  gap: 6px;

  flex-shrink: 0;

  padding-bottom:
  max(6px, env(safe-area-inset-bottom));
}


/* FILE BUTTON */

.file-button {

  width: 40px;
  height: 40px;

  border: none;

  border-radius: 50%;

  background: transparent;

  color: #aebbc5;

  font-size: 22px;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  flex-shrink: 0;
}

.file-button:active {

  background:
  rgba(255,255,255,.08);
}


/* INPUT */

#msg {

  flex: 1;

  min-width: 0;

  height: 42px;

  border: none;

  outline: none;

  border-radius: 21px;

  padding: 0 14px;

  background: #263544;

  color: white;

  font-size: 15px;
}

#msg::placeholder {

  color: #9aa9b3;
}

.send {

}

.send:active {

}


/* ================= UPLOAD ================= */

#fileInput {

  display: none;
}


/* ================= UPLOAD STATUS ================= */

#uploadStatus {

  background: #202b36;

  border-radius: 18px;

}


/* ================= SIDE MENU ================= */

#sideMenu {

  position: fixed;

  top: 0;
  left: 0;

  width: 280px;

  height: 100dvh;

  background: #202b36;

  box-shadow:

}

#sideMenu.open {

  transform:
  translateX(0);
}

#menuOverlay {

  position: fixed;

  inset: 0;

  background:
  rgba(0,0,0,.45);

  z-index: 999;

  display: none;
}

#menuOverlay.open {

  display: block;
}

.menuProfile {

  height: 135px;

  padding: 20px 17px;

  display: flex;

  align-items: center;

}

.menuAvatar {

  width: 55px;

  border-radius: 50%;

  background: #2ea6ff;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 24px;

  font-weight: bold;
}

.menuName {

  font-size: 17px;

  font-weight: bold;
}

.menuOnline {

  margin-top: 4px;

  font-size: 12px;

  color: #35d07f;
}

.menuItem {

  padding: 15px 20px;

  font-size: 16px;

  cursor: pointer;
}

.menuItem:active {

  background: #263544;
}


/* ================= MOBILE ================= */

@media (max-width: 600px) {

  .message {
    max-width: 82%;
  }

  .chat-image {
    max-width: 210px;
    max-height: 280px;
  }

}


/* ================= VERY SMALL SCREEN ================= */

@media (max-height: 650px) {

  .header {
    height: 52px;
    min-height: 52px;
  }

  .input-area {
    min-height: 52px;
  }

    height: 38px;
  }

  .send,
  .file-button {
    width: 38px;
    height: 38px;
  }

}

</style>

<!-- ================= FIREBASE ================= -->

<script type="module">


import {

  initializeApp

} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {

  getDatabase,
  ref,
  push,
  set,
  onValue,
  onChildAdded,
  onDisconnect,
  off,
  remove

} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


import {

  getStorage,
  ref as storageRef,
  uploadBytes,
  getDownloadURL

} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";


/* ================= FIREBASE ================= */

const app = initializeApp({

  apiKey:
  "AIzaSyAVsq99vOv_H3QxukyZBFEzb4zR1J5ha68",

  authDomain:
  "chats-2e309.firebaseapp.com",

  projectId:
  "chats-2e309",

  storageBucket:
  "chats-2e309.firebasestorage.app",

  messagingSenderId:
  "888879915328",

  appId:
  "1:888879915328:web:ece055c1794243915c9aa5",

  databaseURL:
  "https://chats-2e309-default-rtdb.firebaseio.com"

});


const db =
getDatabase(app);


const storage =
getStorage(app);


/* ================= NICK ================= */

let n =
localStorage.getItem("n");


if (!n) {

  n =
  prompt("Твой ник:");

  if (!n || !n.trim()) {

    n =
    "User" +
    Math.floor(Math.random() * 99999);

  }

  n =
  n.trim();

  localStorage.setItem(
    "n",
    n
  );

}


/* ================= MENU ================= */

window.openMenu =
function() {

  document
  .getElementById("sideMenu")
  .classList.add("open");


  document
  .getElementById("menuOverlay")
  .classList.add("open");


  document
  .getElementById("menuName")
  .textContent = n;


  document
  .getElementById("menuAvatar")
  .textContent =
  n.charAt(0).toUpperCase();

};


window.closeMenu =
function() {

  document
  .getElementById("sideMenu")
  .classList.remove("open");


  document
  .getElementById("menuOverlay")
  .classList.remove("open");

};


/* ================= USER KEY ================= */

function userKey(name) {

  return encodeURIComponent(name);

}


/* ================= MY USER ================= */

const myKey =
userKey(n);


set(
  ref(
    db,
    "users/" + myKey
  ),
  {

    name: n,

    created: Date.now()

  }
);


/* ================= ONLINE ================= */

const onlineRef =
ref(
  db,
  "online/" + myKey
);


set(
  onlineRef,
  true
);


onDisconnect(
  onlineRef
).remove();


/* ================= CONTACTS ================= */

let contactsData = {};


onValue(
  ref(db, "users"),

  snapshot => {

    contactsData =
    snapshot.val() || {};

    renderContacts();

  }

);


/* ================= RENDER CONTACTS ================= */

function renderContacts() {

  const container =
  document.getElementById(
    "contacts"
  );


  const search =
  document
  .getElementById("search")
  .value
  .toLowerCase()
  .trim();


  container.innerHTML = "";


  const users =
  Object.values(
    contactsData
  )
  .filter(user => {

    if (!user || !user.name)
      return false;


    if (user.name === n)
      return false;


    return user.name
    .toLowerCase()
    .includes(search);

  });


  document
  .getElementById("usersCount")
  .textContent =

  users.length +
  (
    users.length === 1
    ? " пользователь"
    : " пользователей"
  );


  if (!users.length) {

    container.innerHTML = `

      <div class="empty">
        Нет контактов
      </div>

    `;

    return;

  }


  users.forEach(user => {

    const key =
    userKey(user.name);


    const div =
    document.createElement(
      "div"
    );


    div.className =
    "contact";


    div.innerHTML = `

      <div class="avatar">
        ${escapeHTML(
          user.name
          .charAt(0)
          .toUpperCase()
        )}
      </div>


      <div class="contact-info">

        <div class="contact-name">

          ${escapeHTML(
            user.name
          )}

        </div>


        <div
        class="contact-status"
        id="status-${key}">

          проверка...

        </div>

      </div>

    `;


    div.onclick =
    () => {

      openChat(
        user.name
      );

    };


    container.appendChild(
      div
    );


    onValue(
      ref(
        db,
        "online/" + key
      ),

      snapshot => {

        const status =
        document.getElementById(
          "status-" + key
        );


        if (!status)
          return;


        if (
          snapshot.val() === true
        ) {

          status.textContent =
          "🟢 в сети";

          status.classList.add(
            "online"
          );

        } else {

          status.textContent =
          "был(а) недавно";

          status.classList.remove(
            "online"
          );

        }

      }

    );

  });

}


/* ================= SEARCH ================= */

document
.getElementById("search")
.addEventListener(
  "input",
  renderContacts
);


/* ================= ESCAPE ================= */

function escapeHTML(text) {

  return String(text)

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* ================= CHAT ID ================= */

function chatId(
  user1,
  user2
) {

  const users = [

    userKey(user1),

    userKey(user2)

  ].sort();


  return (
    users[0] +
    "_" +
    users[1]
  );

}


/* ================= OPEN CHAT ================= */

let selectedUser =
null;

let selectedChat =
null;

let messageListener =
null;


window.openChat =
function(username) {

  selectedUser =
  username;


  selectedChat =
  chatId(
    n,
    username
  );


  document
  .getElementById(
    "contactsScreen"
  )
  .style.display =
  "none";


  document
  .getElementById(
    "chatScreen"
  )
  .style.display =
  "flex";


  document
  .getElementById(
    "chatName"
  )
  .textContent =
  username;


  document
  .getElementById(
    "chatAvatar"
  )
  .textContent =
  username
  .charAt(0)
  .toUpperCase();


  document
  .getElementById(
    "chat"
  )
  .innerHTML =
  "";


  if (messageListener) {

    off(
      ref(
        db,
        "chats/" +
        messageListener
      )
    );

  }


  messageListener =
  selectedChat;


  onValue(
    ref(
      db,
      "online/" +
      userKey(username)
    ),

    snapshot => {

      const status =
      document.getElementById(
        "chatStatus"
      );


      if (
        snapshot.val() === true
      ) {

        status.textContent =
        "🟢 в сети";

        status.style.color =
        "#35d07f";

      } else {

        status.textContent =
        "был(а) недавно";

        status.style.color =
        "#8495a0";

      }

    }

  );


  onChildAdded(

    ref(
      db,
      "chats/" +
      selectedChat
    ),

    snapshot => {

      showMessage(
        snapshot.val()
      );

    }

  );

};


/* ================= SHOW MESSAGE ================= */

function showMessage(m) {

  if (!m)
    return;


  const chat =
  document.getElementById(
    "chat"
  );


  const my =
  m.from === n;


  const row =
  document.createElement(
    "div"
  );


  row.className =
  "message-row " +
  (
    my
    ? "my"
    : "other"
  );


  const bubble =
  document.createElement(
    "div"
  );


  bubble.className =
  "message " +
  (
    my
    ? "my"
    : "other"
  );


  /* ================= CONTENT ================= */

  let content = "";


  if (
    m.type === "image" &&
    m.url
  ) {

    content = `

      <img
      src="${escapeHTML(m.url)}"
      class="chat-image"
      onclick="window.open('${escapeHTML(m.url)}','_blank')"
      loading="lazy">

    `;

  }


  else if (
    m.type === "file" &&
    m.url
  ) {

    content = `

      <a
      href="${escapeHTML(m.url)}"
      target="_blank"
      class="file-message">

        <div class="file-icon">
          📄
        </div>

        <div class="file-name">
          ${escapeHTML(
            m.fileName ||
            "Файл"
          )}
        </div>

      </a>

    `;

  }


  else {

    content = `

      <div class="message-text">

        ${escapeHTML(
          m.text || ""
        )}

      </div>

    `;

  }


  /* ================= TIME ================= */

  const date =
  new Date(
    m.time ||
    Date.now()
  );


  const h =
  String(
    date.getHours()
  ).padStart(
    2,
    "0"
  );


  const min =
  String(
    date.getMinutes()
  ).padStart(
    2,
    "0"
  );


  bubble.innerHTML = `

    ${
      !my
      ?
      `

      <div class="message-name">

        ${escapeHTML(
          m.from
        )}

      </div>

      `
      :
      ""
    }


    ${content}


    <div class="message-bottom">

      <span>
        ${h}:${min}
      </span>


      ${
        my
        ?
        "<span>✔✔</span>"
        :
        ""
      }

    </div>

  `;


  row.appendChild(
    bubble
  );


  chat.appendChild(
    row
  );


  chat.scrollTop =
  chat.scrollHeight;

}


/* ================= SEND MESSAGE ================= */

window.sendMessage =
function() {

  const input =
  document.getElementById(
    "msg"
  );


  const text =
  input.value.trim();


  if (!text)
    return;


  if (!selectedUser)
    return;


  push(

    ref(
      db,
      "chats/" +
      selectedChat
    ),

    {

      from: n,

      to: selectedUser,

      text: text,

      type: "text",

      time: Dat
