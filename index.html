<!DOCTYPE html>
<html>
<body style="
margin:0;
background:#17212b;
font-family:Arial,sans-serif;
color:white;
">

<div id="chat"
style="
height:85vh;
overflow-y:auto;
font-size:13px;
font-weight:600;
box-sizing:border-box;
scroll-behavior:smooth;
">
</div>
<input type="file" id="photo" accept="image/*">
<div style="
display:flex;
font-size:28px;
opacity:.7;
background:#202b36;">
 <input
id="msg"
placeholder="Написать сообщение..."
style="
flex:1;
font-size:16px;
line-height:1.4;
border:none;
outline:none;
border-radius:25px;
font-size:16px;
font-weight:600;
background:#263544;
color:white;
">
  <button onclick="s()"
  style="
  margin-left:8px;
  width:48px;
  border:none;
  border-radius:50%;
  background:#2ea6ff;
  color:white;
  font-size:20px;">
  ➤
  </button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getDatabase,ref,push,onChildAdded} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAVsq99vOv_H3QxukyZBFEzb4zR1J5ha68",
  authDomain: "chats-2e309.firebaseapp.com",
  projectId: "chats-2e309",
  storageBucket: "chats-2e309.firebasestorage.app",
  messagingSenderId: "888879915328",
  appId: "1:888879915328:web:ece055c1794243915c9aa5",
  databaseURL: "https://chats-2e309-default-rtdb.firebaseio.com"
});

const db=getDatabase(app);

let n=localStorage.getItem("n");
if(!n){
  n=prompt("Твой ник:");
  localStorage.setItem("n",n);
}

window.s = function () {
  if (!msg.value.trim()) return;

  push(ref(db, "m"), {
    n: n,
    t: msg.value,
    time: Date.now(),
    read: false
  });

  msg.value = "";
}
update(ref(db,"m/"+id),{
  read:true
});
  push(ref(db, "m"), {
    n: n,
    t: msg.value,
    time: Date.now()
  });
set(ref(db,"online/"+n),true);
  msg.value = "";
}
${m.read ? "✔✔" : "✔"}
onChildAdded(ref(db, "m"), d => {
  const m = d.val();

  const date = new Date(m.time || Date.now());
  const h = String(date.getHours()).padStart(2, "0");
  const min = String(date.getMinutes()).padStart(2, "0");

  const my = m.n === n;

  chat.innerHTML += `
  <div style="
    display:flex;
    justify-content:${my ? "flex-end" : "flex-start"};
    margin:8px;
  ">
window.addEventListener("beforeunload",()=>{
  remove(ref(db,"online/"+n));
});
    <div style="
      background:${my ? "#2ea6ff" : "#2b2b2b"};
      color:white;
      padding:10px 14px;
      border-radius:18px;
      max-width:75%;
      word-break:break-word;
      box-shadow:0 2px 6px rgba(0,0,0,.3);
      font-size:30px;
      line-height:1.4;
">
set(ref(db,"typing/"+n),true);
      <div style="
        font-size:30px;
        font-weight:700;
        color:${my ? "#ffffff" : "#8fd3ff"};
        margin-bottom:4px;
">
      
        ${m.n}
      </div>
set(ref(db,"typing/"+n),false);
      <div>
        ${m.t}
      </div>
<button onclick="msg.value+='😏'">😏</button>
<button onclick="msg.value+='😂'">😂</button>
<button onclick="msg.value+='❤️'">❤️</button>
<button onclick="msg.value+='👍'">👍</button>
      <div style="
display:flex;
justify-content:flex-end;
align-items:center;
gap:4px;
font-size:11px;
color:#dfefff;
margin-top:6px;
">
<span>${h}:${min}</span>
<span>${my ? "✔✔" : ""}</span>
</div>

    </div>

  </div>
  `;

  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
